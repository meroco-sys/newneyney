<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ribbon Closet</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #e6e6fa 50%, #f0f8ff 100%);
      --pink-main: #ff9ebb;
      --purple-main: #b39ddb;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border-color: #f8bbd0;
      --text-color: #5d4037;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hiragino Sans', 'ヒラギノ角ゴ ProN', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
      background: rgba(255, 255, 255, 0.5);
      border-left: 1px solid #eee;
      border-right: 1px solid #eee;
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 80px;
    }

    .content {
      padding: 16px;
      flex: 1;
    }

    .tab-page {
      display: none;
    }
    .tab-page.active {
      display: block;
    }

    /* ホーム画面 */
    .grid-menu-3 {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }
    .menu-card-large {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: transform 0.2s;
    }
    .menu-card-large:hover {
      transform: translateY(-2px);
      border-color: var(--pink-main);
    }
    .menu-card-large .icon {
      font-size: 28px;
      margin-bottom: 6px;
    }
    .menu-card-large .title {
      font-size: 16px;
      font-weight: bold;
      color: #4a148c;
    }

    /* コーデ編集画面 */
    .coord-editor {
      background: var(--card-bg);
      border: 2px dashed var(--purple-main);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      gap: 10px;
    }
    .coord-slots {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slot {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 11px;
      overflow: hidden;
      position: relative;
    }
    .slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-side {
      width: 80px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qr-box {
      background: #fff;
      border: 1px solid #f8bbd0;
      border-radius: 10px;
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #aaa;
      overflow: hidden;
    }
    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ボタン類 */
    .btn {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      border: none;
    }
    .btn-outline {
      border: 1px solid #ab47bc;
      background: #fff;
      color: #ab47bc;
    }
    .btn-fill {
      background: #ab47bc;
      color: #fff;
    }
    .btn-save {
      background: #e91e63;
      color: #fff;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 10px;
      font-size: 12px;
    }

    /* 登録フォーム */
    .register-form {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      border: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .form-group label {
      font-size: 11px;
      font-weight: bold;
      color: #6a1b9a;
    }
    .form-group input[type="file"] {
      font-size: 10px;
    }

    /* 保存済みコーデリスト */
    .saved-list {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .saved-item {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .saved-item span {
      font-size: 13px;
      font-weight: bold;
      color: #4a148c;
    }

    /* 4コーデ比較エリア */
    .compare-container {
      display: none;
      margin-top: 10px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 10px;
      border: 2px solid var(--purple-main);
    }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .compare-column {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
      font-size: 8px;
    }
    .compare-slot {
      width: 100%;
      height: 42px;
      background: #fafafa;
      border: 1px dashed #ccc;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 7px;
      color: #999;
    }
    .compare-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ナビゲーションバー */
    .nav-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      height: 60px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #888;
      cursor: pointer;
      border: none;
      background: none;
    }
    .nav-item.active {
      color: #ab47bc;
      font-weight: bold;
    }
    .nav-item .icon {
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <main class="content">
    <!-- ホームタブ -->
    <section id="page-home" class="tab-page active">
      <div class="grid-menu-3">
        <div class="menu-card-large" onclick="switchTab('coord')">
          <div class="icon">👗</div>
          <div class="title">ミックスコーデ</div>
        </div>
        <div class="menu-card-large" onclick="switchTab('register')">
          <div class="icon">➕</div>
          <div class="title">コーデ登録</div>
        </div>
        <div class="menu-card-large" onclick="switchTab('saved')">
          <div class="icon">☆</div>
          <div class="title">保存したコーデ</div>
        </div>
      </div>
    </section>

    <!-- コーデ編集/閲覧タブ -->
    <section id="page-coord" class="tab-page">
      <div style="margin-bottom: 10px; display: flex; gap: 8px;">
        <button class="btn btn-outline" onclick="toggleCompareView()">4コーデ比較</button>
        <button class="btn btn-fill">☆ ベストに登録</button>
      </div>

      <!-- 4コーデ比較エリア -->
      <div id="compare-section" class="compare-container">
        <h4 style="font-size: 11px; color: #9c27b0; margin-bottom: 6px; text-align: center;">4コーデ比較（全身）</h4>
        <div class="compare-grid" id="compare-grid-slots"></div>
      </div>

      <!-- コーデプレビュー -->
      <div class="coord-editor">
        <div class="coord-slots">
          <div class="slot" id="slot-acc">アクセ</div>
          <div class="slot" id="slot-top">トップス</div>
          <div class="slot" id="slot-bottom">ボトムス</div>
          <div class="slot" id="slot-shoes">シューズ</div>
        </div>
        <div class="qr-side">
          <div class="qr-box" id="slot-qr-acc">A-QR</div>
          <div class="qr-box" id="slot-qr-t">T-QR</div>
          <div class="qr-box" id="slot-qr-b">B-QR</div>
          <div class="qr-box" id="slot-qr-s">S-QR</div>
        </div>
      </div>

      <!-- コーデ保存フォーム -->
      <div style="margin-top: 12px; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 12px;">
        <input type="text" id="coord-name-input" placeholder="コーデ名を入力" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; font-size: 12px;">
        <button class="btn btn-save" onclick="saveCurrentCoord()">★ このコーデを名前をつけて保存</button>
      </div>
    </section>

    <!-- 画像・QR登録タブ -->
    <section id="page-register" class="tab-page">
      <div class="register-form">
        <h3 style="font-size: 13px; color: #9c27b0;">パーツとQRコードを登録</h3>

        <div class="form-group"><label>アクセ画像</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'acc')"></div>
        <div class="form-group"><label>トップス画像</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'top')"></div>
        <div class="form-group"><label>ボトムス画像</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'bottom')"></div>
        <div class="form-group"><label>シューズ画像</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'shoes')"></div>

        <hr style="border: none; border-top: 1px dashed #f8bbd0; margin: 2px 0;">

        <div class="form-group"><label>アクセ QR</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'qr-acc')"></div>
        <div class="form-group"><label>トップス QR</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'qr-t')"></div>
        <div class="form-group"><label>ボトムス QR</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'qr-b')"></div>
        <div class="form-group"><label>シューズ QR</label><input type="file" accept="image/*" onchange="loadAndCompressImage(event, 'qr-s')"></div>

        <button class="btn btn-outline" onclick="switchTab('coord')" style="margin-top: 6px;">コーデ画面で確認する →</button>
      </div>
    </section>

    <!-- 保存一覧タブ -->
    <section id="page-saved" class="tab-page">
      <h3 style="font-size: 14px; color: #9c27b0; margin-bottom: 8px;">保存したコーデ一覧</h3>
      <div id="saved-list-container" class="saved-list"></div>
    </section>
  </main>

  <!-- ナビゲーションバー -->
  <nav class="nav-bar">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')"><span class="icon">🏠</span>ホーム</button>
    <button class="nav-item" id="nav-coord" onclick="switchTab('coord')"><span class="icon">👗</span>コーデ</button>
    <button class="nav-item" id="nav-register" onclick="switchTab('register')"><span class="icon">➕</span>登録</button>
    <button class="nav-item" id="nav-saved" onclick="switchTab('saved')"><span class="icon">☆</span>一覧</button>
  </nav>
</div>

<script>
  // IndexedDBの準備
  const DB_NAME = 'RibbonClosetDB';
  const STORE_NAME = 'coords';
  let db;

  function initDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        resolve(db);
      };
      request.onerror = (e) => reject(e);
    });
  }

  // 初期化実行
  initDB();

  let currentCoord = {
    acc: '', top: '', bottom: '', shoes: '',
    'qr-acc': '', 'qr-t': '', 'qr-b': '', 'qr-s': ''
  };

  const defaultLabels = {
    acc: 'アクセ', top: 'トップス', bottom: 'ボトムス', shoes: 'シューズ',
    'qr-acc': 'A-QR', 'qr-t': 'T-QR', 'qr-b': 'B-QR', 'qr-s': 'S-QR'
  };

  function switchTab(tabName) {
    document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

    const targetPage = document.getElementById('page-' + tabName);
    if (targetPage) targetPage.classList.add('active');

    const targetNav = document.getElementById('nav-' + tabName);
    if (targetNav) targetNav.classList.add('active');

    if (tabName === 'saved') renderSavedList();
  }

  function loadAndCompressImage(event, type) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxSide = 400; // 少し綺麗に見えるようサイズ調整
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxSide) {
            height = Math.round((height * maxSide) / width);
            width = maxSide;
          }
        } else {
          if (height > maxSide) {
            width = Math.round((width * maxSide) / height);
            height = maxSide;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
        currentCoord[type] = compressedBase64;
        updateSlotDisplay(type, compressedBase64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function updateSlotDisplay(type, base64) {
    const slotEl = document.getElementById('slot-' + type);
    if (slotEl) {
      if (base64) {
        slotEl.innerHTML = `<img src="${base64}">`;
      } else {
        slotEl.innerHTML = defaultLabels[type];
      }
    }
  }

  function updateAllSlots() {
    Object.keys(currentCoord).forEach(key => {
      updateSlotDisplay(key, currentCoord[key]);
    });
  }

  // IndexedDBへの保存
  async function saveCurrentCoord() {
    const nameInput = document.getElementById('coord-name-input');
    const name = nameInput.value.trim() || '無題のコーデ';
    
    if (!db) await initDB();

    const transaction = db.transaction([STORE_NAME], 'readwrite');
    const store = transaction.objectStore(STORE_NAME);

    const newCoord = {
      id: Date.now(),
      name: name,
      data: { ...currentCoord }
    };

    const request = store.add(newCoord);
    request.onsuccess = () => {
      alert(`「${name}」を大容量データベースに保存しました！`);
      nameInput.value = '';
    };
    request.onerror = () => {
      alert('保存に失敗しました。');
    };
  }

  // IndexedDBからの読み込み
  async function getAllSavedCoords() {
    if (!db) await initDB();
    return new Promise((resolve) => {
      const transaction = db.transaction([STORE_NAME], 'readonly');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
    });
  }

  async function renderSavedList() {
    const container = document.getElementById('saved-list-container');
    const savedList = await getAllSavedCoords();

    if (savedList.length === 0) {
      container.innerHTML = '<p style="font-size:12px; color:#888;">保存されたコーデはありません。</p>';
      return;
    }

    container.innerHTML = savedList.map(item => `
      <div class="saved-item">
        <span>${item.name}</span>
        <div>
          <button class="btn btn-outline" onclick="loadSavedCoord(${item.id})">呼び出す</button>
          <button class="btn btn-fill" style="background:#ff5252;" onclick="deleteSavedCoord(${item.id})">削除</button>
        </div>
      </div>
    `).join('');
  }

  async function loadSavedCoord(id) {
    const savedList = await getAllSavedCoords();
    const target = savedList.find(item => item.id === id);
    if (target) {
      currentCoord = { ...target.data };
      updateAllSlots();
      switchTab('coord');
      alert(`「${target.name}」を表示しました！`);
    }
  }

  async function deleteSavedCoord(id) {
    if (!confirm('削除しますか？')) return;
    if (!db) await initDB();

    const transaction = db.transaction([STORE_NAME], 'readwrite');
    const store = transaction.objectStore(STORE_NAME);
    const request = store.delete(id);

    request.onsuccess = () => {
      renderSavedList();
    };
  }

  async function toggleCompareView() {
    const section = document.getElementById('compare-section');
    const isVisible = section.style.display === 'block';
    section.style.display = isVisible ? 'none' : 'block';

    if (!isVisible) {
      const savedList = await getAllSavedCoords();
      const grid = document.getElementById('compare-grid-slots');
      const targets = savedList.slice(-4).reverse(); // 最新の4つを表示

      if (targets.length === 0) {
        grid.innerHTML = '<p style="grid-column: span 4; font-size:10px; text-align:center; color:#888;">保存されたコーデがありません</p>';
        return;
      }

      grid.innerHTML = targets.map((item) => `
        <div class="compare-column">
          <span style="font-weight:bold; color:#4a148c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;">${item.name}</span>
          <div class="compare-slot">${item.data.acc ? `<img src="${item.data.acc}">` : 'アクセ'}</div>
          <div class="compare-slot">${item.data.top ? `<img src="${item.data.top}">` : 'トップ'}</div>
          <div class="compare-slot">${item.data.bottom ? `<img src="${item.data.bottom}">` : 'ボトム'}</div>
          <div class="compare-slot">${item.data.shoes ? `<img src="${item.data.shoes}">` : 'シューズ'}</div>
        </div>
      `).join('');
    }
  }
</script>

</body>
</html>
